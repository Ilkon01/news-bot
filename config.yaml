#
# У каждого источника есть trust — рейтинг доверия от 1 до 10.
# Когда одна и та же новость приходит из нескольких источников, бот
# пришлёт её только от того, у кого trust выше.
#
# Страна в подписи под новостью — это страна СОБЫТИЯ, её определяет ИИ
# по содержанию статьи, а не страна издания.
# =========================================================

