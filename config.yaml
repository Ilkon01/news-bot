# ---------- ШАГ 3: ДЕДУПЛИКАЦИЯ ----------
# Насколько похожими должны быть заголовки, чтобы считаться одной новостью.
# 0.5 = совпадает половина значимых слов. Меньше — строже склеивает
# (риск потерять разные новости), больше — мягче (риск дублей).
duplicate_threshold: 0.4

# Сколько часов помнить отправленные новости, чтобы не прислать
# ту же самую в следующем запуске от другого источника
duplicate_memory_hours: 72

# Склейка работает в два приёма:
#   1) по оригинальным заголовкам — до обращения к ИИ
#   2) по русскому заголовку и пересказу — после обработки ИИ.
#      Именно второй ловит случаи, когда издания описали одно событие
#      совершенно разными словами.

# ---------- ХЕШТЕГИ ----------
# Под каждой новостью ставятся хештеги темы и страны: #санкции_и_торговые_войны #сша
# В Telegram нажатие на хештег ищет по всему каналу — удобно находить
# все новости по интересующей теме. Поставьте false, чтобы убрать.
show_hashtags: false

