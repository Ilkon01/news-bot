# ---------- ПРАВИЛА ОТБОРА ----------
# Это указания для ИИ, как решать спорные случаи. Пишите обычными словами.
editorial_rules:
  - "Аналитику и разбор событий пропускай — читателю они нужны."
  - "Прогнозы и сценарии «что будет, если» пропускай только от авторитетных источников и только по темам приоритета 3."
  - "Обзоры и материалы о трендах без конкретного события пропускай редко — только если тема приоритета 3 и материал содержательный."
  - "Новость, где есть только заявление политика без действий, пропускай только если это крупная фигура: глава государства, министр, руководитель центробанка или международной организации."
  - "Новости, важные только для одной страны и не связанные с Казахстаном, пропускай только если это событие крупного масштаба."
  - "Новости о компаниях — отчёты, назначения, сделки — пропускай."
  - "Отклоняй новости, которые лишь пересказывают чужую публикацию, не добавляя фактов."

# ---------- ДЛИНА ПЕРЕСКАЗА ----------
summary_length: "4-5 предложений"

never_send:
  - "материалы, продвигающие салафизм или религиозный экстремизм"
  - "светская хроника, сплетни о знаменитостях"
  - "реклама и промо-материалы"
  - "криминальная хроника местного значения"

# ---------- ЛИМИТЫ ----------
# Обращений к ИИ за запуск. При 24 запусках в сутки 35 даёт до 840
# при бесплатном лимите Gemini около 1500.
max_ai_calls_per_run: 35
seconds_between_ai_calls: 3
# Максимум новостей за один запуск. Запуск раз в час, значит это
# и есть скорость подачи: до 20 новостей в час.
max_per_run: 20
