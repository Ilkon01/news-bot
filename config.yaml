#
# У каждого источника три параметра:
#   country — страна, показывается в подписи под новостью
#   trust   — рейтинг доверия от 1 до 10. Когда одна и та же новость
#             приходит из нескольких источников, бот пришлёт её только
#             от того, у кого trust выше.
# =========================================================

