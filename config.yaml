# ---------- ШАГ 1: БЕСПЛАТНЫЙ ОТСЕВ ПО СЛОВАМ ----------
# Новость идёт к ИИ, только если содержит хотя бы одно слово отсюда.
# Это бесплатно и мгновенно — так мы укладываемся в лимиты Gemini.
# Слова ищутся в заголовке и описании, регистр не важен, часть слова тоже
# считается (напр. "sanction" поймает "sanctions", "sanctioned").
keywords:
  # Ближний Восток
  - israel
  - gaza
  - palestin
  - lebanon
  - hezbollah
  - hamas
  - iran
  - syria
  - yemen
  - houthi
  - saudi
  - qatar
  - emirates
  - turkey
  - erdogan
  # Казахстан и регион
  - kazakh
  - almaty
  - astana
  - tokayev
  - central asia
  - uzbek
  - kyrgyz
  - caspian
  - tenge
  # Геополитика и конфликты
  - war
  - military
  - troops
  - strike
  - missile
  - conflict
  - ceasefire
  - coup
  - nato
  - united nations
  - security council
  - china
  - beijing
  - russia
  - putin
  - kremlin
  - ukraine
  - india
  - pakistan
  - africa
  - venezuela
  - taiwan
  - korea
  # Санкции, экономика, рынки
  - sanction
  - tariff
  - trade war
  - export control
  - oil
  - opec
  - gas price
  - inflation
  - central bank
  - interest rate
  - recession
  - imf
  - world bank
  - stock market
  - economy
  - economic
  - currency
  - default
  # Технологии и ИИ
  - artificial intelligence
  - " ai "
  - openai
  - anthropic
  - nvidia
  - semiconductor
  - chip
  - data center
  - crypto
  - bitcoin
  - blockchain
  # Религия и мусульманский мир
  - muslim
  - islam
  - mosque
  - quran
  - hajj
  - umrah
  - ramadan
  - sharia
  - uyghur
  # Прочее из ваших тем
  - election
  - refugee
  - migrant
  - migration
  - terror
  - extremis
  - space
  - nasa
  - climate
  - summit
  - treaty
  - diplomat

# ---------- ШАГ 2: ТОЧНЫЙ ФИЛЬТР ЧЕРЕЗ ИИ ----------
# Приоритеты: 3 = присылать обязательно, 2 = если новость заметная,
# 1 = только крупное событие, 0 = не присылать
topics:
  "Ближневосточный конфликт (Израиль, Газа, Ливан, Иран)": 3
  "Внутренняя политика Казахстана": 3
  "Отношения Казахстана с Китаем, Россией, Западом": 3
  "Экономика и рынки Казахстана": 3
  "Мировая экономика и рынки": 3
  "Санкции и торговые войны": 3
  "Технологии и искусственный интеллект": 3
  "Религия и мусульманский мир": 3
  "Военные конфликты в мире (кроме Украины и Ближнего Востока)": 3
  "Война в Украине и Россия": 2
  "Выборы в других странах": 2
  "Криптовалюта": 2
  "Наука и космос": 2
  "Климат и экология": 2
  "Терроризм и экстремизм (события, не пропаганда)": 2
  "Миграция и беженцы": 2
  "Положение мусульман в немусульманских странах": 2
  "Хадж, умра, паломничество": 1
  "Спорт": 1
  "Шоу-бизнес и культура": 1

breaking_news: true

never_send:
  - "материалы, продвигающие салафизм или религиозный экстремизм"
  - "светская хроника, сплетни о знаменитостях"
  - "реклама и промо-материалы"

# ---------- ЛИМИТЫ (защита от превышения бесплатного тарифа) ----------
# Максимум обращений к Gemini за один запуск.
# 12 запусков в сутки × 40 = 480 запросов, при лимите 1500 — с большим запасом.
max_ai_calls_per_run: 40

# Максимум отправленных сообщений за один запуск
max_per_run: 25
